[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contador-mcp"
version = "0.1.0"
description = "MCP connector (FastMCP) for Argentine accounting firms: monthly compliance calendar, calculators and a RAG knowledge base of tax law."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dense = ["fastembed>=0.4"]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
contador-mcp = "contador_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contador_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
